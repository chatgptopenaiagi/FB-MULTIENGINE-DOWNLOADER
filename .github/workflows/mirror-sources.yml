name: Mirror checksum-verified upstream release sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Reconstruct identical source archive and mirror native asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/mirror_release_sources.py --upload
