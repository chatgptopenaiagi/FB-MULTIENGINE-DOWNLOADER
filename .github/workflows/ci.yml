name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolated dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -c evidence/python-dependencies.txt '.[browser,desktop,api,dev]'
          .venv/Scripts/python.exe -m playwright install chromium
      - name: Tests and static checks
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m ruff check src tests tools --select F
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest --basetemp=.private/ci-tests --junitxml=evidence/ci-python-tests.xml -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Wheel and Windows bundle
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build_windows.ps1
          Compress-Archive -Path dist/windows/FBMD -DestinationPath dist/windows-x64-ci.zip
          Get-FileHash dist/*.whl,dist/*.zip -Algorithm SHA256 | ConvertTo-Json | Set-Content dist/ci-checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-wheel-unreviewed
          path: |
            dist/*.zip
            dist/*.whl
            dist/ci-checksums.json
            evidence/ci-python-tests.xml
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android assembleDebug lintDebug --console=plain
      - run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-unreviewed
          path: |
            android/app/build/outputs/apk/debug/*
            android/app/build/reports/lint-results-debug.*
