plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'org.dragonhydra.fbmd'
    compileSdk 35
    defaultConfig {
        applicationId 'org.dragonhydra.fbmd'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('FBMD_KEYSTORE')) {
                storeFile file(System.getenv('FBMD_KEYSTORE'))
                storePassword System.getenv('FBMD_STORE_PASSWORD')
                keyAlias 'fbmd'
                keyPassword System.getenv('FBMD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    sourceSets { main.assets.srcDirs += [file('../../.toolchain/android-assets')] }
    packaging { jniLibs { useLegacyPackaging = true; excludes += ['**/libffmpeg.zip.so'] }; resources { excludes += ['META-INF/DEPENDENCIES'] } }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
